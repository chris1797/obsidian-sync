<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>쿠버네티스 배포 계층 — Region 안에 Cluster, 그 안에 Namespace, 그 안에 Pod</title>
<desc>물리적 데이터센터(Region) 안에 완결된 k8s 클러스터가 있고, 클러스터를 논리적으로 나눈 Namespace 안에 실제 워크로드인 Pod가 들어 있는 4단 중첩 구조를 아파트 비유로 표현</desc>
<rect x="24" y="24" width="632" height="424" rx="16" fill="#F6F5F0" stroke="#D3D1C7" stroke-width="1"/>
<rect x="60" y="56" width="560" height="372" rx="14" fill="none" stroke="#9A968C" stroke-width="1.5"/>
<text x="80" y="85" font-size="15" font-weight="600" fill="#2C2C2A">Region · 사이트 — ASKOR_HNB01</text>
<text x="80" y="104" font-size="12.5" fill="#5F5E5A">어느 도시·단지 (물리적 위치 · 데이터센터)</text>
<rect x="92" y="116" width="496" height="298" rx="12" fill="none" stroke="#9A968C" stroke-width="1.5"/>
<text x="112" y="145" font-size="15" font-weight="600" fill="#2C2C2A">Cluster — K8S-ENV-SERVER-003</text>
<text x="112" y="164" font-size="12.5" fill="#5F5E5A">아파트 한 동 (완결된 k8s 한 세트)</text>
<rect x="124" y="176" width="432" height="220" rx="12" fill="none" stroke="#9A968C" stroke-width="1.5"/>
<text x="144" y="205" font-size="15" font-weight="600" fill="#2C2C2A">Namespace — aim / aim-qa</text>
<text x="144" y="224" font-size="12.5" fill="#5F5E5A">건물 안 층·구획 (논리적 칸막이)</text>
<rect x="156" y="262" width="368" height="112" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Pod</text>
<text x="340" y="335" text-anchor="middle" font-size="12.5" fill="#185FA5">각 호실의 세대 (실제 컨테이너)</text>
</svg>
